name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0) — leave empty to read from package.json'
        required: false
        default: ''

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, test
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build installer
        run: npm run build:installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenOfficeLLM-Setup
          path: |
            dist/OpenOfficeLLM-Setup-*.exe
            dist/OpenOfficeLLM-*-win.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OpenOfficeLLM-Setup-*.exe
            dist/OpenOfficeLLM-*-win.zip
          generate_release_notes: true
          draft: true

  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, test
        run: |
          npm run typecheck
          npm run lint
          npm test

      # SEA embeds the exact node binary it runs under. GitHub's runner node
      # is a standalone build, so this works as-is; it would silently produce
      # a broken DMG on a shared-library node (Homebrew), see build-sea.mjs.
      - name: Build DMG
        run: npm run build:dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenOfficeLLM-DMG
          path: |
            dist/OpenOfficeLLM-*-macOS.dmg
            dist/OpenOfficeLLM-*-macOS.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OpenOfficeLLM-*-macOS.dmg
            dist/OpenOfficeLLM-*-macOS.zip
          generate_release_notes: true
          draft: true
